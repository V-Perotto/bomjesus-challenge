server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A interface e a API ficam na mesma origem: o Nginx repassa /api ao container do back-end.
    location /api/ {
        proxy_pass http://backend:8080;
        # $http_host preserva a porta (8081), para o header Location sair correto
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: qualquer rota desconhecida devolve o index.html (o Vue Router resolve no navegador)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
