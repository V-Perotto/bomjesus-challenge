# Um banco em memória por contexto de teste: evita que o perfil "demo" contamine outros testes
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};DB_CLOSE_DELAY=-1

# Os testes de erro 500 provocam exceções de propósito; o log ERROR delas só polui a saída
logging.level.br.com.bomjesus.academic.exception.GlobalExceptionHandler=OFF
