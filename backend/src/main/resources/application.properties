spring.application.name=academic-api
server.port=8080

# Banco H2 em memória (Princípio I): inicia vazio a cada execução
spring.datasource.url=jdbc:h2:mem:bomjesus;DB_CLOSE_DELAY=-1
spring.datasource.generate-unique-name=false
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Console web do H2 (FR-027), acessível também a partir do host quando em container
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Origens permitidas para acesso direto entre origens (FR-026a)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
